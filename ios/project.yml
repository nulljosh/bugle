name: journal
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 7.15.0
    CURRENT_PROJECT_VERSION: "202610252056"
    DEVELOPMENT_TEAM: QMM486NPYC

schemes:
  Journal-iOS:
    build:
      targets:
        Journal-iOS: all
        BugleWidget: all
        BugleShare: all
  Bugle-macOS:
    build:
      targets:
        Bugle-macOS: all

targets:
  Journal-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.journal
        INFOPLIST_FILE: Sources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Universal: iPad was never excluded for a design reason, only never enabled.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        CODE_SIGN_ENTITLEMENTS: Journal.entitlements
    dependencies:
      - target: BugleWidget
      - target: BugleShare

  BugleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      # The app's own feeds, parser, grouping, headline cleaning and colors.
      - Sources/Shared/Models/Coverage.swift
      - Sources/Shared/Models/Feed.swift
      - Sources/Shared/Models/Headline.swift
      - Sources/Shared/Models/JournalEntry.swift
      - Sources/Shared/Models/Library.swift
      - Sources/Shared/Models/Theme.swift
      - Sources/Shared/Services/JournalFeedService.swift
      - Sources/Shared/Services/Archive.swift
      - Sources/Shared/Services/Spotlight.swift
      - Sources/Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.journal.widget
        PRODUCT_NAME: BugleWidget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Bugle
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BugleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Share
      - Sources/Shared/Services/Inbox.swift
      - Sources/Shared/Models/Theme.swift
      - Sources/Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.journal.share
        PRODUCT_NAME: BugleShare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: BugleShare.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SHARE_EXTENSION
    info:
      path: Sources/Share/Info.plist
      properties:
        CFBundleDisplayName: Bugle
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1

  Bugle-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.journal
        PRODUCT_NAME: Bugle
        INFOPLIST_FILE: Sources/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Bugle-macOS.entitlements
