<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" style="background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
  <text x="380" y="34" fill="#1d1d1f" font-size="18" font-weight="600" text-anchor="middle">Bugle Architecture</text>
  <text x="380" y="54" fill="#6e6e73" font-size="12" text-anchor="middle">One reader on iPhone, iPad, Mac, Watch and the web. Feeds are read straight from their sites.</text>

  <!-- clients -->
  <g font-size="12" text-anchor="middle" fill="#1d1d1f">
    <rect x="40" y="84" width="150" height="52" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="115" y="106" font-weight="600">iPhone and iPad</text><text x="115" y="123" fill="#6e6e73" font-size="11">SwiftUI, Journal-iOS</text>
    <rect x="215" y="84" width="150" height="52" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="290" y="106" font-weight="600">Mac</text><text x="290" y="123" fill="#6e6e73" font-size="11">SwiftUI, Bugle-macOS</text>
    <rect x="390" y="84" width="150" height="52" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="465" y="106" font-weight="600">Apple Watch</text><text x="465" y="123" fill="#6e6e73" font-size="11">watchos/, same models</text>
    <rect x="565" y="84" width="155" height="52" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="642" y="106" font-weight="600">Web reader</text><text x="642" y="123" fill="#6e6e73" font-size="11">web/read.html, PWA</text>
  </g>

  <!-- lines to cores -->
  <g stroke="#c7c7cc" stroke-width="1.5" fill="none">
    <path d="M115 136 V176 H250"/><path d="M290 136 V176"/><path d="M465 136 V176 H330"/>
    <path d="M642 136 V176"/>
  </g>

  <!-- shared cores -->
  <g font-size="12" text-anchor="middle">
    <rect x="130" y="176" width="320" height="108" rx="12" fill="#0059B3" fill-opacity=".08" stroke="#0059B3"/>
    <text x="290" y="200" fill="#0059B3" font-weight="600">Shared Swift core</text>
    <text x="290" y="222" fill="#1d1d1f" font-size="11">FeedStore: followed feeds, seeds, local newsrooms</text>
    <text x="290" y="239" fill="#1d1d1f" font-size="11">FeedParser: RSS and Atom, widest picture</text>
    <text x="290" y="256" fill="#1d1d1f" font-size="11">Coverage: stories across outlets, leans, Today, mutes</text>
    <text x="290" y="273" fill="#1d1d1f" font-size="11">Library: saved, history, topics. Headline: clean titles</text>
    <rect x="490" y="176" width="230" height="108" rx="12" fill="#0059B3" fill-opacity=".08" stroke="#0059B3"/>
    <text x="605" y="200" fill="#0059B3" font-weight="600">Web mirrors</text>
    <text x="605" y="222" fill="#1d1d1f" font-size="11">parse.js, coverage.js</text>
    <text x="605" y="239" fill="#1d1d1f" font-size="11">headline.js, library.js</text>
    <text x="605" y="256" fill="#1d1d1f" font-size="11">same rules, checked by test.mjs</text>
    <text x="605" y="273" fill="#1d1d1f" font-size="11">sw.js: offline pages and pictures</text>
  </g>
  <path d="M450 230 H490" stroke="#0059B3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="470" y="222" fill="#6e6e73" font-size="10" text-anchor="middle">mirror</text>

  <!-- lines to sources -->
  <g stroke="#c7c7cc" stroke-width="1.5" fill="none">
    <path d="M190 284 V380"/><path d="M380 284 V380"/><path d="M620 284 V380"/><path d="M540 284 V336 H420 V380"/>
  </g>

  <!-- sources and services -->
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="380" width="230" height="56" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="175" y="404" fill="#1d1d1f" font-weight="600">Any RSS or Atom feed</text>
    <text x="175" y="421" fill="#6e6e73" font-size="11">fetched straight from the site</text>
    <rect x="310" y="380" width="180" height="56" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="400" y="404" fill="#1d1d1f" font-weight="600">jaybulb-api</text>
    <text x="400" y="421" fill="#6e6e73" font-size="11">optional account, one sync row</text>
    <rect x="510" y="380" width="210" height="56" rx="10" fill="#f5f5f7" stroke="#d1d1d6"/>
    <text x="615" y="404" fill="#1d1d1f" font-weight="600">Pages Functions</text>
    <text x="615" y="421" fill="#6e6e73" font-size="11">/feed proxy to any feed, /og image</text>
  </g>
  <text x="380" y="480" fill="#6e6e73" font-size="11" text-anchor="middle">Sync carries feeds, saved stories, history, topics and mutes. Reading never needs an account.</text>
</svg>
