name: BugleWatch
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "5.9"   # same as the phone app, whose model and parser files it shares
  MARKETING_VERSION: "1.22.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
targets:
  BugleWatch:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.yml"
          - "*.md"
          - "*.svg"
      # One reader everywhere: the phone's feed list, parser, grouping, headline cleaning and colors.
      - ../ios/Sources/Shared/Models/Coverage.swift
      - ../ios/Sources/Shared/Models/Feed.swift
      - ../ios/Sources/Shared/Models/Headline.swift
      - ../ios/Sources/Shared/Models/JournalEntry.swift
      - ../ios/Sources/Shared/Models/Library.swift
      - ../ios/Sources/Shared/Models/Theme.swift
      - ../ios/Sources/Shared/Services/JournalFeedService.swift
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.journal.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: Bugle
